<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashley Manuel | CV</title>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color: #e5e7eb;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: linear-gradient(145deg, #020617, #0f172a);
  padding: 3rem;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,.7);
}

h1 {
  font-size: 2.6rem;
  margin-bottom: .5rem;
  background: linear-gradient(90deg, #38bdf8, #22c55e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p {
  color: #94a3b8;
}

.buttons {
  margin-top: 2rem;
  display: flex;
  gap: 1.2rem;
  justify-content: center;
  flex-wrap: wrap;
}

a {
  text-decoration: none;
  padding: .9rem 2rem;
  border-radius: 999px;
  font-weight: 700;
  background: linear-gradient(135deg, #38bdf8, #22c55e);
  color: #020617;
  box-shadow: 0 10px 25px rgba(0,0,0,.5);
  transition: transform 0.3s;
}
a:hover {
  transform: scale(1.1);
}
</style>
</head>
<body>
<div class="card">
  <h1>Ashley Manuel</h1>
  <p>SC Cleared · Senior Platform Infrastructure Engineer</p>
  <p>Reading, UK · ✉️ ash@aamanuel-rocks.co.uk</p>
  <div class="buttons">
    <a href="consultant.html">Consultant CV</a>
    <a href="engineer.html">Engineer CV</a>
  </div>
</div>
</body>
</html>
